<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC Bank – Transactions</title><link rel="icon" href="img/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/transactions.css"></head>
<body><main id="page-content"><section class="card"><h2>Transactions</h2>
<form id="filters" class="filters"><label>Account<select class="form-select" name="account_id" id="account"><option value="">All</option></select></label>
<label>Type<select class="form-select" name="type"><option value="">All</option><option value="TRANSFER">Transfer</option><option value="DEPOSIT">Deposit</option><option value="LOAN_DISBURSEMENT">Loan disbursement</option><option value="LOAN_REPAYMENT">Loan repayment</option><option value="REVERSAL">Reversal</option></select></label>
<label>Status<select class="form-select" name="status"><option value="">All</option><option value="COMPLETED">Completed</option><option value="FAILED">Failed</option><option value="REVERSED">Reversed</option></select></label>
<label>From<input class="form-input" type="date" name="from_date"></label><label>To<input class="form-input" type="date" name="to_date"></label>
<button class="btn btn-primary" id="apply" type="submit">Apply</button><button class="btn btn-secondary" type="reset">Reset</button></form>
<table class="table"><thead><tr><th>Date</th><th>Type</th><th>Counterparty</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div class="row"><button class="btn btn-secondary" id="prev">Previous</button><span id="pg"></span><button class="btn btn-secondary" id="next">Next</button></div></section></main>
<script src="js/api.js"></script><script src="js/icons.js"></script><script src="js/common.js"></script><script src="js/transactions.js"></script></body></html>
